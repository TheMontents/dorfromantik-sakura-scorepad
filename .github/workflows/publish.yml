name: Publish image

# Builds the container image and pushes it to GHCR.
#
# Triggered by a version tag (v1.2.3), because the homelab stack pins an exact
# tag: an image that nobody can name is an image the deployment cannot use.
# Manual runs are allowed for re-publishing a tag after a registry hiccup.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Without this the build runs on the default docker driver, which has no
      # cache exporters: `cache-to: type=gha` then fails with "buildx failed".
      # The container driver that setup-buildx installs supports them.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2 and `latest`. The moving tag exists for convenience (`docker
      # run` without a tag); deployments must not pin it, because Dependabot
      # cannot bump a moving tag and it hides which version actually runs.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # auto = `latest` for real releases, not for prereleases such as
          # 0.2.0-rc1. Stated explicitly so the intent is visible.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Dorfromantik Sakura Score Pad
            org.opencontainers.image.description=Unofficial digital score pad for Dorfromantik: Sakura

      # The NAS runs on x86_64, so one platform is enough – building arm64 as
      # well would roughly double the build time for nothing.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
