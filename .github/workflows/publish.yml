name: Publish image

# Builds the container image and pushes it to GHCR.
#
# Triggered by a version tag (v1.2.3), because the homelab stack pins an exact
# tag: an image that nobody can name is an image the deployment cannot use.
# Manual runs are allowed for re-publishing a tag after a registry hiccup.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Without this the build runs on the default docker driver, which has no
      # cache exporters: `cache-to: type=gha` then fails with "buildx failed".
      # The container driver that setup-buildx installs supports them.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 and 1.2 — no `latest`. The homelab stacks pin exact tags on
      # purpose: a moving tag cannot be bumped by Dependabot and hides which
      # version is actually running.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Dorfromantik Sakura Score Pad
            org.opencontainers.image.description=Unofficial digital score pad for Dorfromantik: Sakura

      # The NAS runs on x86_64, so one platform is enough – building arm64 as
      # well would roughly double the build time for nothing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
