server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # unofficial fan tool: keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # single-page app: everything falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets may stay in the cache for a long time
    location /assets/ {
        # One header, not `expires` plus add_header – that sends two
        # conflicting Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A location with its own add_header does not inherit the ones above,
        # so the robots header has to be repeated here.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # never cache the service worker or the manifest, or updates never arrive.
    # `expires -1` already sends Cache-Control: no-cache – adding one by hand
    # only produced a second, conflicting header.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
